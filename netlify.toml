# MyMBPM en Netlify: web Next.js (export estatico) + API Express como Netlify Function,
# ambas en el mismo sitio. La base es Netlify DB (Neon / PostgreSQL).

[build]
  base = "/"
  # Genera el cliente Prisma, aplica migraciones pendientes y exporta la web.
  command = "npm run build:netlify"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "22"
  # El sitio define NODE_ENV=production en todos los scopes (el plan gratuito no permite
  # limitarla a Functions). Con eso npm omite las devDependencies y el build se rompe:
  # next build no encuentra @types/react e intenta instalarlas por su cuenta con yarn.
  # --include=dev funciona igual con npm ci y con npm install. En runtime la function
  # sigue viendo NODE_ENV=production.
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"
  # @prisma/client carga el cliente generado (.prisma/client) por ruta en runtime: no se bundlea.
  external_node_modules = ["@prisma/client"]
  # Prisma 7 no tiene query engine nativo: el cliente generado trae el compilador de consultas en
  # WASM (query_compiler_fast_bg*.js, solo PostgreSQL) y se conecta con @prisma/adapter-pg, que si
  # se bundlea. npm deja @prisma/client y el cliente generado en apps/api/node_modules. Se excluye lo
  # que no se usa en runtime: el .wasm suelto (se carga la version base64), los tipos, el runtime
  # edge, los compiladores de otros motores que trae @prisma/client/runtime, los source maps y los
  # peers opcionales (prisma CLI, typescript).
  included_files = [
    "apps/api/node_modules/.prisma/client/**",
    "!apps/api/node_modules/.prisma/client/*.wasm",
    "!apps/api/node_modules/.prisma/client/*.d.ts",
    "!apps/api/node_modules/.prisma/client/edge.js",
    "!apps/api/node_modules/@prisma/client/runtime/query_compiler_*",
    "!apps/api/node_modules/@prisma/client/runtime/*.map",
    "!apps/api/node_modules/@prisma/client/runtime/*.mjs",
    "!apps/api/node_modules/prisma/**",
    "!apps/api/node_modules/@prisma/engines/**",
    "!node_modules/typescript/**"
  ]

# Encabezados de seguridad (CSP con hashes de los scripts inline de Next, HSTS, nosniff, etc.): no
# van aca sino en apps/web/out/_headers, que genera apps/web/scripts/generar-encabezados.mjs al
# final del build de la web. Ver docs/despliegue-netlify.md.

# La API responde bajo /api/* en el mismo dominio que la web (sin CORS).
# El rewrite (200) conserva el path original, que Express enruta tal cual.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
